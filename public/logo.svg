<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0679a"/>
      <stop offset="1" stop-color="#a8326a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- back half of the spin ring, behind the dancer -->
    <path d="M14 50 C14 44 50 44 50 50" stroke-width="2.2" stroke-opacity="0.45"/>
    <!-- arms rounded overhead (fifth position) -->
    <path d="M28.6 21.2 C21.5 16.5 22.8 8.6 29.6 7.8" stroke-width="3.2"/>
    <path d="M35.4 21.2 C42.5 16.5 41.2 8.6 34.4 7.8" stroke-width="3.2"/>
    <!-- torso -->
    <path d="M32 20 L32 33.5" stroke-width="6"/>
    <!-- standing leg on relevé -->
    <path d="M31.4 33.5 L31.4 45.5 L31.8 58" stroke-width="3.8"/>
    <!-- passé: knee out to the side, toe at the standing knee -->
    <path d="M33.2 34 L42 40 L32.6 45" stroke-width="3.8"/>
    <!-- front half of the spin ring, with an arrow -->
    <path d="M50 50 C50 56 14 56 14 50" stroke-width="2.4"/>
    <path d="M16.6 47.6 L14 50.2 L12 46.9" stroke-width="2.4"/>
  </g>
  <circle cx="32" cy="14.4" r="3.9" fill="#fff"/>
</svg>
